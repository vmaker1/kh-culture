name: 수집 및 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 공연·전시 데이터 수집
        env:
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          CULTURE_KEY: ${{ secrets.CULTURE_KEY }}
        run: python scripts/collect.py --days 120
        continue-on-error: true
      - name: 변경분 커밋
        run: |
          git config user.name  "kh-culture-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/events.json
          git diff --staged --quiet || git commit -m "데이터 갱신 $(date +'%Y-%m-%d')"
          git push
        continue-on-error: true

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
